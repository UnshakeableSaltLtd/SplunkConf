[install]
is_configured = 0
state = enabled

[ui]
is_visible = 1
label = TA_ResponseActions - Notable to Perplexity / Slack

[launcher]
author = David Pollard
description = Two independent Adaptive Response actions for Splunk Enterprise Security, split in v1.4.0: "Send Notable to Perplexity API (Agentic Response)" answers a standing "perplexity_ask" block of checks synchronously via the Perplexity API and writes the result back to the notable (comment + KV store) - closing the agentic loop in-line, with no separate polling agent or bridge required, and with no Slack objects in this flow. "Send Notable to Slack (ES Findings)" posts the SAME JSON envelope, unanswered, to the #es-findings Slack channel for human visibility - entirely independent of the agentic flow, so either action can be enabled/disabled or have its credentials rotated on its own. Both share native Adaptive Response panel reporting, notable comment write-back, and a KV store enrichment record surfaced via a custom Incident Review drilldown. The app's GUI nav includes a README/overview page and a Setup page for submitting/updating the Slack bot token and Perplexity API key.
version = 1.4.14

[package]
id = TA_ResponseActions
