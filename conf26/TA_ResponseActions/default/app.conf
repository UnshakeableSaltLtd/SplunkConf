label = Notable to Slack (Full JSON)

[launcher]
author = David Pollard
description = Adaptive Response action for Splunk Enterprise Security that sends the triggering Notable/Finding to Slack as a complete JSON payload, with support for extra custom fields, native Adaptive Response panel reporting, notable comment write-back, and a KV store enrichment record surfaced via a custom Incident Review drilldown. Also answers a standing "perplexity_ask" block of checks synchronously via the Perplexity API before delivery, merging the result in as "perplexity_response" - closing the agentic loop in-line, with no separate polling agent or bridge required.
