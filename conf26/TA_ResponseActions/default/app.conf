label = Notable to Slack (Full JSON)

[launcher]
author = David Pollard
description = Adaptive Response action for Splunk Enterprise Security that sends the triggering Notable/Finding to Slack as a complete JSON payload, with support for extra custom fields, native Adaptive Response panel reporting, notable comment write-back, and a KV store enrichment record surfaced via a custom Incident Review drilldown. Also ships a Slack->HEC bridge (bin/slack_hec_bridge.py) that closes the agentic loop: it reads the AI's structured reply back out of the Slack thread, writes a CIM-compliant risk event to Splunk ES, and enriches the originating notable - all with no human intervention.
version = 1.3.2

[package]
id = TA_ResponseActions
