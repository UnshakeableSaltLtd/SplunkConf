##
## Custom Adaptive Response Actions (split in v1.4.0 - see README.md release
## notes for the full rationale):
##
##   [notable_to_perplexity_json] - AGENTIC RESPONSE flow. Answers the
##     notable's "perplexity_ask" block synchronously via the Perplexity API
##     and writes the result back to the notable (comment + KV store). NO
##     Slack objects/params - Slack delivery is not part of this flow.
##
##   [notable_to_slack_json] - NOTIFICATION flow. Posts the SAME JSON
##     envelope (built by the shared ta_common.build_payload()) to the
##     #es-findings Slack channel for human visibility. NOT part of the
##     agentic response process - never calls Perplexity.
##
## Both share bin/ta_common.py for payload construction, credential vault
## lookups, and write-back-to-notable helpers, so the two actions stay in
## lockstep on payload shape while being independently configurable,
## enable/disable-able, and credential-rotatable.
##
## Prerequisite: Splunk_SA_CIM (the Common Information Model Add-on) must
## be installed for the native Incident Review "Adaptive Responses" panel
## reporting to work. It ships by default with every Splunk ES install.
## If it's missing, both actions still run; they just skip the panel status
## update.
##

[notable_to_perplexity_json]
is_custom = 1
label = Send Notable to Perplexity API (Agentic Response)
description = Agentic response action. Answers the notable's "perplexity_ask" block synchronously via the Perplexity API and writes the result (perplexity_response) back to the SAME notable - comment write-back and a KV store enrichment record. Contains no Slack objects; use "Send Notable to Slack (ES Findings)" separately for human notification.
icon_path = appIcon.png
payload_format = json
python.version = python3
alert.execute.cmd = notable_to_perplexity_json.py
# Explicitly overriding alert.execute.cmd (above) disables Splunk's default
# auto-injection of "--execute" as argv[1] - that auto-behaviour only applies
# when alert.execute.cmd is left unset and Splunk resolves the script itself.
# Once you customise the command, YOU must supply every argument, including
# --execute, via alert.execute.cmd.arg.N. Missing this caused splunkd to
# invoke the script with no arguments at all (see FATAL invocation contract
# violation in the script's own log) even though btool showed a fully correct
# merged stanza - the config was valid, just incomplete.
alert.execute.cmd.arg.1 = --execute

# Common Action Model classification. supports_adhoc=true is required for the
# action to be offered under Incident Review's "Run Adaptive Response Action".
# drilldown_uri points the action's row in the notable's Adaptive Responses
# panel at our custom KV-store-backed dashboard instead of the default
# "search for result events" link - the SAME dashboard notable_to_slack_json
# also drills into (see default/collections.conf, transforms.conf, and
# default/data/ui/views/notable_agentic_enrichment_drilldown.xml).
# Token support for drilldown_uri is limited to $sid$/$rid$/$time$/$earliest$/$latest$/$action_name$.
param._cam = {"category": ["Information Conveyance"], "task": ["notify"], "subject": ["notable"], "technology": [{"vendor": "Splunk", "product": "Splunk Enterprise Security"}], "supports_adhoc": true, "drilldown_uri": "notable_agentic_enrichment_drilldown?form.sid=$sid$&form.rid=$rid$"}

# --- payload shaping ---
# JSON object (or Splunk-style tokens $result.<field>$ / $job.<field>$) merged into
# the outgoing payload under "additional_fields". Tokens are substituted per-event by the script.
# Default ships a "perplexity_ask" block: three standing checks run against every notable (is
# the repo one we commonly see, is the user expected, and is the source IP low threat). When
# param.perplexity_enabled is on, notable_to_perplexity_json.py answers these synchronously via the
# Perplexity API and merges the result back in as "perplexity_response". Override/extend per
# correlation search as needed. This is the SAME additional_fields template
# notable_to_slack_json.py uses to build its (unanswered) Slack copy of the payload.
param.additional_fields = {"perplexity_ask": {"repository_check": "Check that $result.repo$ is a repository we commonly see associated with this type of finding.","user_check": "Check that $result.user$ is an expected/authorized user for this kind of activity.","source_ip_check": "Check that source IP $result.src$ is low threat (not on any known malicious/blocklist sources)."}}

# Comma-separated list of fields to strip from the notable before processing (noise/internal fields).
param.field_denylist = _raw,_time,_indextime,_cd,_bkt,_si,splunk_server,timestartpos,timeendpos,eventtype,punct

param.include_raw_event = 0
param.pretty_print = 1

# Safety cap: max number of result rows to process per invocation (protects against runaway loops
# when the action is attached to a bulk/summary search rather than a single notable).
param.max_events = 5

# --- write-back to the notable ---
# When enabled, after processing the action also POSTs a comment to
# /services/notable_update on the SAME notable (matched via its event_id), so the
# perplexity_ask/perplexity_response pair appears in that notable's own Activity timeline in
# Incident Review - alongside the rest of the event, for any analyst who opens it. Only comment
# text is supported (no new custom fields via this endpoint). Independently of this setting, the
# action's success/failure is always reported to the native "Adaptive Responses" panel via
# cim_actions.ModularAction.
param.write_back_comment = 1

# Structured write-back: persist a full record (event_id, delivery_method="perplexity_api",
# additional_fields JSON, status/error) to the notable_agentic_enrichment KV store collection,
# keyed by this invocation's sid/rid - the SAME collection notable_to_slack_json.py writes to.
# Surfaced to analysts via the drilldown_uri configured above - use this when you need real
# structured data next to the notable, not just comment text.
param.write_back_kvstore = 1

# --- Perplexity API: synchronous ask/response ---
# When enabled, notable_to_perplexity_json.py answers the "perplexity_ask" block above via the
# Perplexity API, merging the result into additional_fields.perplexity_response.
# Preferred: store the API key in Splunk's credential vault and reference the realm here (see the
# Setup page in the app's GUI nav, or curl storage/passwords directly - same pattern as below).
param.perplexity_enabled = 1
param.perplexity_api_key_realm = perplexity_notable_action
# Fallback only (plaintext) - leave blank if using the vault above.
param.perplexity_api_key =
# Perplexity's Agent API (v1.4.5+; see README.md release notes) picks a model in
# one of two ways - set AT MOST ONE of the pair below:
#   * param.perplexity_model: pin an exact "provider/model" id (e.g.
#     openai/gpt-5.6-sol) if you need a specific model.
#   * param.perplexity_preset: use a Perplexity-managed preset instead (e.g.
#     fast-search, pro-search) - recommended default, since Perplexity tunes the
#     underlying model/tooling over time with no config change needed here.
# If perplexity_model is set it always wins over perplexity_preset. Leave
# perplexity_model blank (the default) to use the preset below.
param.perplexity_model =
# fast-search is quick and web-search-capable - the closest equivalent to the old
# Sonar-based default's speed/cost profile for these short triage checks.
# https://docs.perplexity.ai/docs/agent-api/presets
param.perplexity_preset = fast-search

# --- Testing connectivity / credentials ---
# Side-effect-free credential check mode. When enabled, the action skips ALL normal processing
# (no result rows are read, nothing is written back to any notable comment or KV store record)
# and instead just resolves+probes the Perplexity credential via a minimal 1-token completion
# (only if perplexity_enabled=1). Outcome is logged unambiguously as PERPLEXITY AUTH OK, AUTH
# FAILURE, or AUTH SKIPPED (not configured) in
# $SPLUNK_HOME/var/log/splunk/notable_to_perplexity_json.log - grep for "AUTH FAILURE" to find a
# bad/expired/revoked key fast. See README.md "Testing connectivity / credentials" for the full
# walkthrough. Leave at 0 for normal operation; this is meant to be set to 1 only for an ad-hoc
# manual check, e.g. via Splunk's sendalert search command:
#   | makeresults | sendalert notable_to_perplexity_json param.test_connectivity=1
param.test_connectivity = 0


[notable_to_slack_json]
is_custom = 1
label = Send Notable to Slack (ES Findings)
description = Notification action. Posts the triggering notable/finding to the #es-findings Slack channel as a JSON file (or JSON code block) - the SAME payload shape built for the agentic Perplexity flow, but unanswered (no perplexity_response merged in). NOT part of the agentic response process; enable/disable and rotate its Slack credential independently of "Send Notable to Perplexity API".
icon_path = appIcon.png
payload_format = json
python.version = python3
alert.execute.cmd = notable_to_slack_json.py
# See the identical comment on notable_to_perplexity_json's alert.execute.cmd
# above - customising alert.execute.cmd requires explicitly supplying
# --execute yourself via alert.execute.cmd.arg.N.
alert.execute.cmd.arg.1 = --execute

# Common Action Model classification - see notable_to_perplexity_json above for details on
# supports_adhoc/drilldown_uri. Both actions drill into the SAME dashboard.
param._cam = {"category": ["Information Conveyance"], "task": ["notify"], "subject": ["notable"], "technology": [{"vendor": "Splunk", "product": "Splunk Enterprise Security"}], "supports_adhoc": true, "drilldown_uri": "notable_agentic_enrichment_drilldown?form.sid=$sid$&form.rid=$rid$"}

# --- Delivery method ---
# file_upload (recommended): uses a Slack bot token + the files.getUploadURLExternal /
#   files.completeUploadExternal flow to deliver the ENTIRE JSON payload with no size limit.
# webhook: quick to set up, but Slack blocks cap at ~3000 chars, so large notables get truncated.
param.delivery_method = file_upload

# --- webhook delivery (optional, quick start) ---
param.slack_webhook_url =

# --- file_upload delivery (recommended, secure) ---
# Preferred: store the bot token in Splunk's credential vault and reference the realm here (see
# the Setup page in the app's GUI nav, or curl storage/passwords directly):
#   e.g. curl -k https://localhost:8089/servicesNS/nobody/TA_ResponseActions/storage/passwords \
#          -u admin:changeme \
#          -d name=slack_notable_action -d realm=slack_notable_action -d password=xoxb-...
param.slack_bot_token_realm = slack_notable_action
# Fallback only (plaintext) - leave blank if using the vault above.
param.slack_bot_token =
# #es-findings channel ID.
param.slack_channel = C0BKA6D4AFL

# --- payload shaping ---
# JSON object (or Splunk-style tokens $result.<field>$ / $job.<field>$) merged into the outgoing
# payload under "additional_fields" - the SAME template notable_to_perplexity_json.py uses. Any
# "perplexity_ask" block here is posted to Slack unanswered (this action never calls Perplexity) -
# purely for visual/human audit of what the agentic action was asked to evaluate. Override/extend
# per correlation search as needed.
param.additional_fields = {"perplexity_ask": {"repository_check": "Check that $result.repo$ is a repository we commonly see associated with this type of finding.","user_check": "Check that $result.user$ is an expected/authorized user for this kind of activity.","source_ip_check": "Check that source IP $result.src$ is low threat (not on any known malicious/blocklist sources)."}}

# Comma-separated list of fields to strip from the notable before sending (noise/internal fields).
param.field_denylist = _raw,_time,_indextime,_cd,_bkt,_si,splunk_server,timestartpos,timeendpos,eventtype,punct

param.include_raw_event = 0
param.pretty_print = 1

# Safety cap: max number of result rows to post per invocation (protects against runaway loops
# when the action is attached to a bulk/summary search rather than a single notable).
param.max_events = 5

# --- write-back to the notable ---
# When enabled, after a successful Slack send the action also POSTs a comment to
# /services/notable_update on the SAME notable (matched via its event_id), so the collected
# data appears in that notable's own Activity timeline in Incident Review - alongside the rest
# of the event, for any analyst who opens it. Only comment text is supported (no new custom
# fields via this endpoint). Independently of this setting, the action's success/failure is
# always reported to the native "Adaptive Responses" panel via cim_actions.ModularAction.
param.write_back_comment = 1

# Structured write-back: persist a full record (event_id, delivery details, additional_fields
# JSON, status/error) to the notable_agentic_enrichment KV store collection, keyed by this
# invocation's sid/rid - the SAME collection notable_to_perplexity_json.py writes to. Surfaced to
# analysts via the drilldown_uri configured above - use this when you need real structured data
# next to the notable, not just comment text.
param.write_back_kvstore = 1

# --- Testing connectivity / credentials ---
# Side-effect-free credential check mode. When enabled, the action skips ALL normal processing
# (no result rows are read, nothing is sent to Slack, nothing is written back to any notable
# comment or KV store record) and instead just resolves+probes the Slack credential via
# auth.test (no message posted). Outcome is logged unambiguously as SLACK AUTH OK, AUTH FAILURE,
# or AUTH SKIPPED (not configured) in $SPLUNK_HOME/var/log/splunk/notable_to_slack_json.log -
# grep for "AUTH FAILURE" to find a bad/expired/revoked token fast. See README.md "Testing
# connectivity / credentials" for the full walkthrough. Leave at 0 for normal operation; this is
# meant to be set to 1 only for an ad-hoc manual check, e.g. via Splunk's sendalert search
# command:
#   | makeresults | sendalert notable_to_slack_json param.test_connectivity=1
param.test_connectivity = 0
