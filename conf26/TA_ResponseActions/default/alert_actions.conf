##
## Custom Adaptive Response Action: notable_to_slack_json
## Sends the triggering Notable/Finding to Slack as a full JSON payload,
## merged with any additional custom fields you define below.
##
## Prerequisite: Splunk_SA_CIM (the Common Information Model Add-on) must
## be installed for the native Incident Review "Adaptive Responses" panel
## reporting to work. It ships by default with every Splunk ES install.
## If it's missing, the action still delivers to Slack; it just skips the
## panel status update.
##

[notable_to_slack_json]
is_custom = 1
label = Send Notable to Slack (Full JSON)
description = Sends the triggering notable/finding to Slack as a JSON file (or JSON code block), including all CIM/risk fields plus any custom additional fields you define.
icon_path = appIcon.png
payload_format = json
python.version = python3
alert.execute.cmd = notable_to_slack_json.py

# --- Delivery method ---
# file_upload (recommended): uses a Slack bot token + the files.getUploadURLExternal /
#   files.completeUploadExternal flow to deliver the ENTIRE JSON payload with no size limit.
# webhook: quick to set up, but Slack blocks cap at ~3000 chars, so large notables get truncated.
param.delivery_method = file_upload

# --- webhook delivery (optional, quick start) ---
param.slack_webhook_url =

# --- file_upload delivery (recommended, secure) ---
# Preferred: store the bot token in Splunk's credential vault and reference the realm here.
#   e.g. curl -k https://localhost:8089/servicesNS/nobody/TA_ResponseActions/storage/passwords \
#          -u admin:changeme \
#          -d name=slack_notable_action -d realm=slack_notable_action -d password=xoxb-...
param.slack_bot_token_realm = slack_notable_action
# Fallback only (plaintext) - leave blank if using the vault above.
param.slack_bot_token =
param.slack_channel =

# --- payload shaping ---
# JSON object (or Splunk-style tokens $result.<field>$ / $job.<field>$) merged into
# the outgoing payload under "additional_fields". Tokens are substituted per-event by the script.
param.additional_fields =

# Comma-separated list of fields to strip from the notable before sending (noise/internal fields).
param.field_denylist = _raw,_time,_indextime,_cd,_bkt,_si,splunk_server,timestartpos,timeendpos,eventtype,punct

param.include_raw_event = 0
param.pretty_print = 1

# Safety cap: max number of result rows to post per invocation (protects against runaway loops
# when the action is attached to a bulk/summary search rather than a single notable).
param.max_events = 5

# --- write-back to the notable ---
# When enabled, after a successful Slack send the action also POSTs a comment to
# /services/notable_update on the SAME notable (matched via its event_id), so the collected
# data appears in that notable's own Activity timeline in Incident Review - alongside the rest
# of the event, for any analyst who opens it. Only comment text is supported (no new custom
# fields via this endpoint). Independently of this setting, the action's success/failure is
# always reported to the native "Adaptive Responses" panel via cim_actions.ModularAction.
param.write_back_comment = 1
