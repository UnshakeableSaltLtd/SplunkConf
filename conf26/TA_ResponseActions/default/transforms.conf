##
## Lookup wrapper for the notable_slack_enrichment KV store collection.
## Needed to query the collection with inputlookup/outputlookup (the
## storage/collections/data REST endpoint used by the script for writes
## does not require this, but Simple XML/SPL reads do).
##
[notable_slack_enrichment_lookup]
external_type = kvstore
collection = notable_slack_enrichment
fields_list = _key, sid, rid, orig_sid, orig_rid, event_id, sent_at, delivery_method, slack_channel, slack_permalink, additional_fields, status, error, slack_thread_ts, awaiting_ai_response, risk_object, risk_object_type, risk_score, risk_message, hec_sent, notable_enriched_at
