#
# TA_ResponseActions - default/inputs.conf
#
# Registers bin/slack_hec_bridge.py (Phase 2/3 of the agentic loop - see
# ../SEC1215/ARCHITECTURE.md) as a classic scripted input, NOT a full
# splunklib.modularinput scheme. This is a deliberate simplification for
# an internal poller: Splunk does not deliver the custom keys below to
# a classic scripted input the way it would to a modular input, so
# bin/slack_hec_bridge.py self-parses this stanza directly via
# configparser (see that script's load_stanza_config()). Trade-off:
# there is no auto-generated Splunk Web config page for these settings -
# edit local/inputs.conf directly (documented as a pitfall for
# Takeaway 3 in ../SEC1215/ARCHITECTURE.md).
#
# passAuth = splunk-system-user makes splunkd append a local session key
# as the LAST argument to the script on every invocation, so the bridge
# can call splunkd's own REST API (KV store, notable_update) with no
# separate login step.
#
[script://./bin/slack_hec_bridge.py]
disabled = 0
interval = 60
python.version = python3
passAuth = splunk-system-user
index = _internal

# --- custom keys, self-parsed by slack_hec_bridge.py (see above) ---
# Splunk index that receives the CIM Risk event via HEC. Defaults to
# "risk" if omitted. The HEC token in vault realm hec_token_realm must
# have write scope to this index.
risk_index = risk

# Full HEC collector URL for this Splunk instance, e.g.
# https://splunk-hec.internal.example.com:8088. The script appends
# /services/collector/event itself if not already present.
hec_url =

# storage/passwords realm holding the HEC token used for risk_index writes.
# Create it the same way as slack_notable_action (see README.md's
# installation steps) - realm=hec_risk_bridge, username can be anything
# (e.g. "hec"), password=<the HEC token>.
hec_token_realm = hec_risk_bridge

# storage/passwords realm holding the Slack bot token used to read
# thread replies via conversations.replies. Reuses the SAME realm as
# the file_upload delivery path in alert_actions.conf.
slack_bot_token_realm = slack_notable_action
