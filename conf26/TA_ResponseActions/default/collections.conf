##
## KV store collection: notable_slack_enrichment
##
## Structured record of what notable_to_slack_json.py collected/sent for a
## given notable, keyed so it can be looked up by the AR invocation's own
## sid/rid (the only tokens Incident Review's custom drilldown_uri supports)
## or by the notable's event_id (for ad hoc lookups from search).
##
## This is the "Option C" pattern for surfacing genuinely structured fields
## next to a notable, since /services/notable_update only supports free-text
## comments - see default/data/ui/views/notable_slack_enrichment_drilldown.xml
## and the param._cam.drilldown_uri wiring in alert_actions.conf.
##
[notable_slack_enrichment]
field.sid             = string
field.rid             = string
field.orig_sid        = string
field.orig_rid        = string
field.event_id        = string
field.sent_at         = string
field.delivery_method = string
field.slack_channel   = string
field.slack_permalink = string
field.additional_fields = string
field.status          = string
field.error           = string

# --- 1.3.1: Phase 2/3 bridge fields (bin/slack_hec_bridge.py) ---
# slack_thread_ts/awaiting_ai_response are written by notable_to_slack_json.py
# at delivery time (file_upload only - see README.md's "Known limitation").
# The bridge polls awaiting_ai_response=1, then fills in the risk_* verdict
# fields plus hec_sent/notable_enriched_at once it has parsed a reply and
# written the corresponding CIM Risk event to index=risk.
field.slack_thread_ts     = string
field.awaiting_ai_response = number
field.risk_object         = string
field.risk_object_type    = string
field.risk_score          = number
field.risk_message        = string
field.hec_sent            = number
field.notable_enriched_at = string

accelerated_fields.by_sid_rid  = {"sid": 1, "rid": 1}
accelerated_fields.by_event_id = {"event_id": 1}
accelerated_fields.by_awaiting_ai_response = {"awaiting_ai_response": 1}
