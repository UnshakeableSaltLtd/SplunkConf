##
## Lookup wrapper for the notable_agentic_enrichment KV store collection.
## Needed to query the collection with inputlookup/outputlookup (the
## storage/collections/data REST endpoint used by the script for writes
## does not require this, but Simple XML/SPL reads do).
##
[notable_agentic_enrichment_lookup]
external_type = kvstore
collection = notable_agentic_enrichment
fields_list = _key, sid, rid, orig_sid, orig_rid, event_id, sent_at, delivery_method, slack_channel, slack_permalink, additional_fields, status, error, urgency_set, hard_escalation, hard_escalation_reasons
